approval_policy = "never"
sandbox_mode = "danger-full-access"
approvals_reviewer = "user"
[projects."/Users/chase"]
trust_level = "trusted"

[projects."/Users/chase/ftc"]
trust_level = "trusted"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-remaining", "five-hour-limit", "weekly-limit", "permissions"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4
gpt-6-astra = 3

[notice]
