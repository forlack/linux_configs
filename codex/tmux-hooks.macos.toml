# Append to ~/.codex/config.toml to enable tmux working/done indicators.
[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "bash ~/linux_configs/tmux/agent-state.sh working"
timeout = 5

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "bash ~/linux_configs/codex/hooks/bell.sh"
timeout = 5
